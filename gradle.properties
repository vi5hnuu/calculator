org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 bundles its own Kotlin, but KSP (used by Room + Hilt) is not compatible with it.
# Opt out so the standalone kotlin-android plugin drives compilation instead.
# That plugin in turn cannot read AGP 9's new DSL, so stay on the classic one.
# Both flags come out once KSP supports built-in Kotlin; AGP 10 removes them.
android.builtInKotlin=false
android.newDsl=false

# The two flags above are deprecated by definition, and the legacy DSL they re-enable warns
# on every build. The warnings are expected and actionable only by KSP upstream, so silence
# them rather than let real warnings drown in the noise.
android.suppressUnsupportedOptionWarnings=android.builtInKotlin,android.newDsl
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
